
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>See You in Two Months</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #111827;
            color: #f9fafb;
            font-family: Arial, sans-serif;
            padding: 24px;
        }

        main {
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: clamp(2rem, 7vw, 3.5rem);
            margin-bottom: 24px;
        }

        h2 {
            color: #60a5fa;
            font-size: 1.5rem;
        }

        p {
            color: #9ca3af;
            line-height: 1.8;
            font-size: 1.1rem;
        }

        footer {
            margin-top: 48px;
            font-size: 0.85rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <main>
        <h1>See You in Two Months 👋</h1>
        <h2>I'm off to military service.</h2>
        <p>
            Taking a short break from the digital world.
            I'll be back in two months.
        </p>
        <p>Until then, stay curious.</p>

        <footer>
            Built with HTML & CSS · Hosted on GitHub Pages
        </footer>
    </main>
</body>
</html>
